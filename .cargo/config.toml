[registries.akazukin-snapshots]
index = "sparse+https://nexus.akazukin.org/repository/cargo-public-libraries-snapshots/"
credential-provider = "cargo:token"

[registries.akazukin-releases]
index = "sparse+https://nexus.akazukin.org/repository/cargo-public-libraries-releases/"
credential-provider = "cargo:token"

[registries.akazukin-mixed]
index = "sparse+https://nexus.akazukin.org/repository/cargo-public-libraries/"
credential-provider = "cargo:token"


[build]
rustflags = ["-Z", "threads=8"]
jobs = 8

[profile.dev]
codegen-units = 365
opt-level = 0
debug = true
panic = "unwind"
lto = false
incremental = true

[profile.release]
codegen-units = 1
opt-level = 3
debug = false
panic = "abort"
lto = "fat"
